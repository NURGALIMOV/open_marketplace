name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            dockerfile: Dockerfile.backend
            image: ghcr.io/${{ github.repository_owner }}/open-marketplace/backend
          - component: frontend
            dockerfile: Dockerfile.frontend
            image: ghcr.io/${{ github.repository_owner }}/open-marketplace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
      - name: Set KUBECONFIG
        run: echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Substitute image tags
        run: |
          sed -i "s#ghcr.io/OWNER/open-marketplace/backend:{{GIT_SHA}}#ghcr.io/${{ github.repository_owner }}/open-marketplace/backend:sha-${{ github.sha }}#g" k8s/backend-deployment.yaml
          sed -i "s#ghcr.io/OWNER/open-marketplace/frontend:{{GIT_SHA}}#ghcr.io/${{ github.repository_owner }}/open-marketplace/frontend:sha-${{ github.sha }}#g" k8s/frontend-deployment.yaml
          sed -i "s#YOUR_DOMAIN#your.domain#g" k8s/ingress.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n open-marketplace apply -f k8s/backend-secret.yaml
          kubectl -n open-marketplace apply -f k8s/configmap.yaml
          kubectl -n open-marketplace apply -f k8s/backend-deployment.yaml -f k8s/backend-service.yaml
          kubectl -n open-marketplace apply -f k8s/frontend-deployment.yaml -f k8s/frontend-service.yaml
          kubectl -n open-marketplace apply -f k8s/ingress.yaml

      - name: Wait rollout
        run: |
          kubectl -n open-marketplace rollout status deploy/backend --timeout=180s
          kubectl -n open-marketplace rollout status deploy/frontend --timeout=180s
