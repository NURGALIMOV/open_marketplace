apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-marketplace
  namespace: open-marketplace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # если используешь cert-manager с ClusterIssuer "letsencrypt"
    # cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  # включи TLS, когда будет домен/сертификат
  # tls:
  #   - hosts: [YOUR_DOMAIN]
  #     secretName: open-marketplace-tls
  rules:
    - host: YOUR_DOMAIN
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
